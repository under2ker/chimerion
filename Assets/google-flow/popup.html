<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Google Flow Bypass</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <span class="title">Google Flow <span class="bypass"><span class="bypass-white">By</span><span class="bypass-blue">pa</span><span class="bypass-red">ss</span></span></span>
  </header>

  <main>
    <label class="row" for="enabled">
      <span class="row-text">
        <span class="row-title">Google Flow Bypass</span>
        <span class="row-sub">Открывает Flow и позволяет быстро его перезагружать.</span>
      </span>
      <span class="switch">
        <input id="enabled" type="checkbox" role="switch" disabled>
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>

    <p id="status" class="status" role="status">Проверка…</p>

    <div class="actions">
      <button id="open" class="btn primary">Открыть Flow</button>
      <button id="reload" class="btn ghost">Перезагрузить</button>
    </div>

    <p id="error" class="error" role="alert"></p>
  </main>

  <footer class="foot">
    <a class="help" href="https://github.com/LZTD1/google-flow-geobypass" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false">
        <path d="M12 .75a11.25 11.25 0 0 0-3.558 21.923c.563.104.768-.244.768-.542 0-.267-.01-.975-.015-1.914-3.13.68-3.79-1.508-3.79-1.508-.512-1.3-1.25-1.646-1.25-1.646-1.022-.7.078-.686.078-.686 1.13.08 1.725 1.16 1.725 1.16 1.005 1.723 2.637 1.225 3.279.937.102-.728.393-1.225.715-1.507-2.499-.284-5.126-1.25-5.126-5.565 0-1.23.44-2.234 1.16-3.022-.117-.285-.503-1.43.11-2.98 0 0 .945-.303 3.094 1.154A10.78 10.78 0 0 1 12 6.176c.956.004 1.918.129 2.817.378 2.148-1.457 3.091-1.154 3.091-1.154.615 1.55.229 2.695.113 2.98.722.788 1.158 1.792 1.158 3.022 0 4.327-2.631 5.278-5.138 5.557.404.35.765 1.04.765 2.096 0 1.514-.014 2.735-.014 3.106 0 .3.203.651.774.541A11.252 11.252 0 0 0 12 .75Z"/>
      </svg>
      <span>GitHub</span>
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
