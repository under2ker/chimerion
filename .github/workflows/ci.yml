# Сборка и тесты при каждом пуше в main и в pull request
name: Сборка и тесты

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Тесты
        run: dotnet test tests/CHIMERION.Tests -c Release
      - name: Сборка
        run: dotnet publish CHIMERION.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o out
      - uses: actions/upload-artifact@v4
        with:
          name: CHIMERION-win-x64
          path: out/CHIMERION.exe
